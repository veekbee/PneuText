[project]
name = "pneutext"
version = "0.1.0"
description = "A local research workbench for close reading: annotate, cross-reference and publish commentary on existing texts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
pneutext = "pneutext.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pneutext"]
artifacts = ["pneutext/web/dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "SIM", "RUF"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
